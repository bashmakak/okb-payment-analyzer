<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оспаривание сделок — конструктор заявлений</title>
<style>
/* @@FONT@@ */
/*
 * Оформление повторяет «Платежи после сделки»: та же палитра, та же плиточная
 * раскладка, те же таблетки вкладок и кнопок, тот же градиент на главной
 * плитке. Два инструмента одного набора должны читаться как один продукт,
 * поэтому имена классов здесь намеренно совпадают с анализатором отчётов —
 * правку оформления так удобнее переносить один в один.
 *
 * Палитра: алебастровый #F1ECE6 и тёплый грейж #DDD5CD — поверхности,
 * угольный #2B2D31 — текст, терракота #8D321F — акцент, олива #3A4027 —
 * «готово», бежевый #C29B72 — заливка шкал.
 */
:root{
  --bg:#F1ECE6;--surface:#FBF9F6;--surface-2:#E7E0D8;--greige:#DDD5CD;
  --line:#DDD5CD;--line-2:#C6BCB1;
  --ink:#2B2D31;--ink-2:#5F6165;--ink-3:#8A867F;
  --acc:#8D321F;--acc-2:#A94229;--acc-wash:#F6E7E2;--acc-line:#E2C6BC;
  --rose:#7D4047;--olive:#3A4027;--olive-wash:#E9EBDF;--beige:#C29B72;
  --hero:linear-gradient(135deg,#8D321F 0%,#7D4047 100%);
  --r:16px;--r-sm:10px;
  --shadow:0 1px 2px rgba(43,45,49,.05),0 10px 24px -18px rgba(43,45,49,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);
  font-family:Onest,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.page{max-width:1180px;margin:0 auto;padding:0 22px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- шапка ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.mark{width:26px;height:26px;border-radius:8px;flex:none;background:var(--hero)}
.ttl{font-weight:600;font-size:15px;letter-spacing:-.015em}
.who{font-size:12.5px;color:var(--ink-2)}
.act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;
  padding:8px 16px;font-size:13.5px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#FBF9F6;font-weight:600}
.btn.pri:hover{background:var(--acc-2);border-color:var(--acc-2);color:#FBF9F6}
.btn.danger:hover{border-color:var(--acc);color:var(--acc)}
.btn-sm{padding:5px 12px;font-size:12.5px}
.linkbtn{border:0;background:none;color:var(--ink-3);font-size:12.5px;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;padding:0}
.linkbtn:hover{color:var(--acc)}

/* ---------- крошки ---------- */
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);
  padding:16px 0 0;flex-wrap:wrap}
.crumbs a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid transparent}
.crumbs a:hover{color:var(--acc);border-bottom-color:var(--acc-line)}

/* ---------- плитки ---------- */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;padding:16px 0 0;align-items:start}
.t{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;
  display:flex;flex-direction:column;gap:9px;min-width:0;box-shadow:var(--shadow)}
.bento.anim>*{animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
.bento.anim>*:nth-child(1){animation-delay:0ms}.bento.anim>*:nth-child(2){animation-delay:50ms}
.bento.anim>*:nth-child(3){animation-delay:90ms}.bento.anim>*:nth-child(4){animation-delay:130ms}
.bento.anim>*:nth-child(5){animation-delay:170ms}.bento.anim>*:nth-child(6){animation-delay:210ms}
.bento.anim>*:nth-child(n+7){animation-delay:250ms}
.t.link{cursor:pointer;transition:transform .18s,border-color .18s;text-align:left;font:inherit;color:inherit}
.t.link:hover{transform:translateY(-2px);border-color:var(--line-2)}
.k{font-size:12.5px;color:var(--ink-2);font-weight:500}
.v{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1}
.m{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}
.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}

/* главная плитка */
.hero{background:var(--hero);border-color:transparent;color:#F6EFE9;padding:26px 28px;gap:0}
.hero .k{color:#EBD5CC;font-weight:600}
.hero .big{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:12px 0 0;color:#FBF7F2}
.hero .big small{font-size:25px;font-weight:600;color:#EBD5CC}
.hero h2{font-size:29px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:10px 0 0;color:#FBF7F2}
/* Название сделки берётся из справочника («договор купли-продажи») — в плитке
   и в подписи над ней оно должно начинаться с прописной. */
.hero h2::first-letter,.hero .k::first-letter{text-transform:uppercase}
.hero .said{font-size:14.5px;color:#F6EFE9;margin:14px 0 0;line-height:1.5;max-width:56ch}
.hero .said b{font-weight:700;color:#fff}
.hero .strip{display:flex;gap:28px;margin-top:20px;padding-top:18px;
  border-top:1px solid rgba(246,239,233,.28);flex-wrap:wrap}
.hero .strip div{color:#EBD5CC;font-size:12.5px;font-weight:500}
.hero .strip b{display:block;color:#FBF7F2;font-size:21px;font-weight:700;letter-spacing:-.02em;margin-bottom:1px}
.hero .act{margin:18px 0 0}
.hero .btn{background:rgba(251,249,246,.14);border-color:rgba(246,239,233,.4);color:#FBF7F2}
.hero .btn:hover{background:rgba(251,249,246,.24);border-color:#FBF7F2;color:#fff}
.hero .btn.pri{background:#FBF7F2;border-color:#FBF7F2;color:var(--acc)}
.hero .btn.pri:hover{background:#fff;color:var(--acc-2)}

/* карточка дела */
.casecard .no{font-size:12.5px;color:var(--acc);font-weight:600}
.casecard h3{font-size:17px;letter-spacing:-.02em}
.casecard .strip{display:flex;gap:18px;margin-top:auto;padding-top:11px;
  border-top:1px solid var(--line);flex-wrap:wrap}
.casecard .strip div{font-size:12px;color:var(--ink-3)}
.casecard .strip b{display:block;font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.02em}

/* приглашение начать — тот же приём, что экран загрузки анализатора */
.up{padding:22px 0 40px;display:grid;grid-template-columns:repeat(12,1fr);gap:12px;align-items:start}
.drop{grid-column:span 7;border:2px dashed var(--line-2);background:var(--surface);border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:56px 30px;
  cursor:pointer;text-align:center;transition:border-color .15s,background .15s;font:inherit;color:inherit}
.drop:hover{border-color:var(--acc);background:var(--acc-wash)}
.drop .ic{width:48px;height:48px;border-radius:15px;background:var(--hero);margin-bottom:6px;
  display:flex;align-items:center;justify-content:center;color:#FBF9F6;font-size:27px;font-weight:300;line-height:1}
.drop b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.drop span{color:var(--ink-3);font-size:13.5px}
.aside{grid-column:span 5;display:flex;flex-direction:column;gap:12px}
.steps{display:flex;flex-direction:column;gap:12px}
.stp{display:flex;gap:12px;align-items:flex-start}
.stp .n{width:25px;height:25px;border-radius:999px;background:var(--acc-wash);color:var(--acc);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.stp b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.stp .m{display:block}

/* ---------- вкладки-таблетки ---------- */
.tabs{display:flex;gap:7px;padding:22px 0 14px;flex-wrap:wrap}
.tab{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;
  padding:7px 15px;font-size:13px;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--ink-3);color:var(--ink)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#FBF9F6;font-weight:600}
.tab .n{opacity:.7;font-weight:400;margin-left:5px}

/* ---------- карточки-разделы ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow)}
.card>h3{font-size:14px;margin-bottom:2px}
.card>.m{margin-bottom:14px}
.note{border-radius:var(--r-sm);padding:13px 16px;font-size:13px;line-height:1.55;margin:0 0 12px;
  background:var(--acc-wash);color:var(--ink-2);border:1px solid var(--acc-line)}
.note b{color:var(--ink);font-weight:600}
.note.calm{background:var(--surface-2);border-color:var(--line)}
.note.good{background:var(--olive-wash);border-color:#CFD3BF;color:var(--olive)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:34px 24px;
  text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px;font-weight:600}
.hint{font-size:12px;color:var(--ink-3);line-height:1.5;margin:8px 0 0}

/* шкала заполненности — как индикатор доли кредитора в анализаторе */
.meter{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;min-width:36px}
.meter i{display:block;height:100%;background:var(--beige);border-radius:999px;transform-origin:left;
  animation:grow .6s .1s cubic-bezier(.2,.8,.2,1) both}
.meter i.done{background:var(--olive)}
.chipm{background:var(--surface-2);border-radius:999px;padding:3px 11px;font-size:11.5px;color:var(--ink-2);
  font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chipm .dot{width:7px;height:7px;border-radius:50%;background:var(--olive);flex:none}
.chipm.w{color:var(--acc)}
.chipm.w .dot{background:var(--acc)}

/* ---------- формы ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 18px}
.f{min-width:0}
.f.wide{grid-column:1/-1}
label.lb{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
label.lb .req{color:var(--acc)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;
  border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:9px 11px;
  font-size:13.5px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:76px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-wash)}
input[readonly]{background:var(--surface-2);color:var(--ink-2)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);padding:6px 0;cursor:pointer}
.chk:hover{color:var(--ink)}
.chk input{width:16px;height:16px;accent-color:var(--acc);margin:2px 0 0;flex:none}
.radios{display:flex;gap:7px;flex-wrap:wrap}
.radio{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 15px;
  font-size:13px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center}
.radio:hover{border-color:var(--ink-3);color:var(--ink)}
.radio.on{background:var(--acc);border-color:var(--acc);color:#FBF9F6;font-weight:600}
.radio input{display:none}
/* следующий шаг анкеты появляется мягко, а не выпрыгивает */
.step{animation:pop .28s both}

/* ---------- таблицы ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:11.5px;font-weight:500;color:var(--ink-3);padding:0 10px 8px;white-space:nowrap}
th.r{text-align:right}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
td.r{text-align:right;white-space:nowrap}
td.sub{color:var(--ink-3)}
tbody tr:hover td{background:var(--surface-2)}
tr.click{cursor:pointer}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600}
.pill.draft{background:var(--surface-2);color:var(--ink-2)}
.pill.ready{background:var(--olive-wash);color:var(--olive)}
.rowact{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- стороны ---------- */
.party{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:var(--r-sm);margin-bottom:8px;background:var(--surface)}
.party .nm{font-weight:600;font-size:14px}
.party .rq{font-size:12px;color:var(--ink-3)}
.party .tag{background:var(--acc-wash);color:var(--acc);border-radius:999px;padding:2px 9px;
  font-size:11px;font-weight:600;flex:none}
.party .sp{margin-left:auto;display:flex;gap:6px}

/* ---------- конструктор ---------- */
.builder{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;align-items:start;padding-bottom:34px}
.left{grid-column:span 5;display:flex;flex-direction:column;gap:12px}
.right{grid-column:span 7;position:sticky;top:14px}
.blocks{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.blocks .bh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.blocks .bh h3{font-size:14px}
.blocks .bh .m{margin-left:auto}
.blk{border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk.drag{opacity:.35}
.blk.over{box-shadow:inset 0 2px 0 var(--acc)}
.blk .row{display:flex;align-items:center;gap:10px;padding:10px 14px}
.blk .row:hover{background:var(--surface-2)}
.blk .grip{cursor:grab;color:var(--ink-3);flex:none;width:12px;text-align:center;line-height:1;
  font-size:14px;user-select:none}
.blk .grip:active{cursor:grabbing}
.blk input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);flex:none;margin:0}
.blk .nm{flex:1;min-width:0;font-size:13.5px;cursor:pointer}
.blk .nm b{display:block;font-weight:600}
.blk .nm span{font-size:11.5px;color:var(--ink-3)}
.blk.off .nm b{color:var(--ink-3);font-weight:500}
.blk .flag{font-size:10.5px;border-radius:999px;padding:2px 8px;background:var(--surface-2);
  color:var(--ink-3);flex:none;white-space:nowrap}
.blk .flag.cond{background:var(--acc-wash);color:var(--acc)}
.blk .flag.edit{background:var(--olive-wash);color:var(--olive)}
.blk .body{padding:2px 14px 14px;background:var(--bg);border-top:1px solid var(--line)}
.blk .body textarea{min-height:150px;font-size:12.5px;line-height:1.55;background:var(--surface)}
.blk .body .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}

/* предпросмотр */
.preview{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.preview .ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.preview .ph h3{font-size:14px}
.preview .ph .m{margin-left:auto}
.paper{padding:26px 30px;max-height:calc(100vh - 150px);overflow:auto;background:#fff;
  font-family:"Times New Roman",Georgia,serif;font-size:15px;line-height:1.55;color:#161616}
.paper p{margin:0 0 .35em;text-align:justify;text-indent:1.25em}
.paper p.center{text-align:center;text-indent:0}
.paper p.right{text-align:right;text-indent:0}
.paper p.left{text-align:left;text-indent:0}
.paper p.b{font-weight:700}
.paper .miss{background:var(--acc-wash);color:var(--acc);border-radius:3px;padding:0 5px;
  font-family:Onest,system-ui,sans-serif;font-size:11.5px;white-space:nowrap}

/* проверка */
.check li{font-size:13px;color:var(--ink-2);margin:0 0 5px;line-height:1.45}
.check ul{margin:6px 0 0;padding-left:18px}
.check h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.check .note.warn h4{color:var(--acc)}

/* ---------- модальные окна ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(43,45,49,.42);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 18px;overflow:auto}
.modal .box{background:var(--surface);border-radius:var(--r);width:100%;max-width:680px;
  box-shadow:0 24px 60px -20px rgba(43,45,49,.5);padding:22px 24px 18px;animation:pop .18s ease}
.modal .box.wide{max-width:1000px}
.modal h3{font-size:17px;margin-bottom:2px}
.modal .lead{font-size:13px;color:var(--ink-2);margin:0 0 16px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
.modal .foot .left{margin-right:auto}

.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
.vars h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:6px}
.vars button{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 6px;
  border-radius:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.vars button:hover{background:var(--acc-wash);color:var(--acc)}
.vars code{font-size:11px;color:var(--ink-3);display:block}

.versions .v{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r-sm);margin-bottom:8px;background:var(--surface);flex-wrap:wrap;
  font-size:15px;font-weight:400;letter-spacing:normal}
.versions .v b{font-size:13.5px;font-weight:600}
.versions .v .m{flex:1;min-width:120px}
.diff{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;
  max-height:52vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.diff .add{background:var(--olive-wash);color:var(--olive);display:block}
.diff .del{background:var(--acc-wash);color:var(--acc);display:block;text-decoration:line-through}
.diff .same{color:var(--ink-3);display:block}

/* ---------- листы для печати ---------- */
.sheets{background:#6B6762;padding:18px;border-radius:var(--r);max-height:calc(100vh - 250px);
  overflow:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.sheet{width:210mm;min-height:297mm;background:#fff;box-shadow:0 6px 20px -12px rgba(0,0,0,.6);
  padding:20mm 15mm 20mm 30mm;position:relative;flex:none;
  font-family:"Times New Roman",Georgia,serif;font-size:14pt;line-height:1.5;color:#000;
  transform:scale(var(--zoom,1));transform-origin:top center}
.sheetbody p,.docmeasure p{margin:0;text-align:justify;text-indent:1.25em}
.sheetbody p.center,.docmeasure p.center{text-align:center;text-indent:0}
.sheetbody p.right,.docmeasure p.right{text-align:right;text-indent:0}
.sheetbody p.left,.docmeasure p.left{text-align:left;text-indent:0}
.sheetbody p.b,.docmeasure p.b{font-weight:700}
.sheetnum{position:absolute;left:0;right:0;bottom:9mm;text-align:center;font-size:11pt;color:#444}
/* Контейнер для замера высот: те же метрики, но вне потока и вне глаз. */
.docmeasure{position:absolute;left:-10000px;top:0;visibility:hidden;
  font-family:"Times New Roman",Georgia,serif;font-size:14pt;line-height:1.5}

/* ---------- печать ---------- */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body.printmode>*{display:none!important}
  body.printmode>#modal-root{display:block!important}
  body.printmode .modal{display:block!important;position:static;background:none;padding:0;overflow:visible}
  body.printmode .modal .box{box-shadow:none;padding:0;max-width:none;background:#fff;
    overflow:visible;animation:none}
  body.printmode .modal .box>*:not(.sheets){display:none!important}
  body.printmode .sheets{background:#fff;padding:0;max-height:none;overflow:visible;display:block;border-radius:0}
  body.printmode .sheet{box-shadow:none;margin:0!important;transform:none!important;break-after:page}
  body.printmode .sheet:last-child{break-after:auto}
}

/* ---------- узкие экраны ---------- */
@media (max-width:1000px){
  .hero .big{font-size:44px}

}
@media (max-width:640px){

  table,thead,tbody,th,td,tr{display:block}

  .rowact{justify-content:flex-start;margin-top:6px}

}
