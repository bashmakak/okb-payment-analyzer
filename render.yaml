# Render Blueprint: статический сайт.
#
# Тип «static» раздаётся с CDN и НЕ засыпает — в отличие от бесплатных
# Web Services, которые останавливаются после 15 минут простоя. Поэтому
# никакого автопинга здесь не нужно.
#
# Собранный dist/index.html лежит в репозитории, поэтому сборка на стороне
# Render не запускается: деплой не может сломаться из-за установки зависимостей.
services:
  - type: web
    name: okb-payment-analyzer
    runtime: static
    buildCommand: ""
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
