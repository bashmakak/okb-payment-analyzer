<script>/*
 * Модель данных, шаблонизатор и правила проверки.
 *
 * Хранилище — localStorage браузера. Своего сервера у приложения нет
 * намеренно: страница должна открываться двойным кликом с флешки, а
 * реквизиты должников и контрагентов — не покидать компьютер.
 *
 * Ни одна функция отсюда не знает про DOM: то же самое выполняется в Node,
 * и на этом построены тесты.
 */
(function () {
  'use strict';

  const D = globalThis.ZData;
  const KEY = 'zayav-db';
  const SCHEMA = 1;

  const uid = () => 'x' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const now = () => new Date().toISOString();

  /* ================= каркасы сущностей ================= */

  function newDb() {
    return {
      schema: SCHEMA,
      profile: { name: '', sro: '', address: '', contacts: '' },
      cases: [],
      customBlocks: [],     // блоки, созданные пользователем (§11)
      edits: {}             // правки текстов стандартных блоков: id → template
    };
  }

  function newParty(kind) {
    return {
      id: uid(), kind: kind || 'org',
      nameFull: '', nameShort: '', inn: '', ogrn: '',
      addressLegal: '', addressPostal: '', director: '', representative: '', powerBasis: '',
      fio: '', birthDate: '', address: '', ogrnip: '',
      role: ''             // 'debtor' — должник дела, подставляется автоматически
    };
  }

  function newCase() {
    const debtor = newParty('org');
    debtor.role = 'debtor';
    return {
      id: uid(), createdAt: now(), updatedAt: now(),
      court: '', courtAddress: '', number: '',
      procedure: 'bankruptcy', procedureDate: '', judicialAct: '', caseStartDate: '',
      managerName: '', managerAddress: '', managerContacts: '', managerSro: '',
      creditorsSum: '',
      debtorId: debtor.id,
      parties: [debtor],
      deals: []
    };
  }

  function newObject(kind) {
    return {
      kind: kind || 'realty',
      // недвижимость
      realtyKind: '', address: '', cadastral: '', area: '', purpose: '', features: '',
      // транспортное средство
      brand: '', model: '', vin: '', plate: '', year: '',
      // денежные средства
      sum: '', payDate: '', orderNumber: '', accountFrom: '', accountTo: '', purposeText: '',
      // иное
      description: '',
      value: ''            // стоимость — общая для всех типов
    };
  }

  function newDeal() {
    return {
      id: uid(), createdAt: now(), updatedAt: now(),
      title: '',
      type: 'sale', typeOther: '',
      date: '', number: '', contractDate: '',
      amount: '', currency: 'RUB', subject: '',
      counterpartyId: '', otherPartyIds: [],
      object: newObject('realty'),
      performance: { state: 'full', date: '', method: '' },
      counter: { state: 'full', debtorValue: '', counterValue: '', note: '', reasons: '' },
      flags: {
        unequal: false, harm: false, affiliation: false, preference: false, awareness: false
      },
      affiliationGrounds: [], affiliationNote: '',
      preferenceGrounds: [], preferenceNote: '',
      harmNote: '', awarenessNote: '', circumstances: '',
      documents: [],
      statement: newStatement()
    };
  }

  function newStatement() {
    return { status: 'draft', blocks: [], versions: [], seq: 0 };
  }

  function newDocument() {
    return { id: uid(), name: '', type: 'contract', date: '', number: '', file: '', description: '', attach: true };
  }

  /* ================= загрузка и сохранение ================= */

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* приватный режим */ }
    if (!raw) return newDb();
    try {
      const db = JSON.parse(raw);
      return db && db.cases ? migrate(db) : newDb();
    } catch (e) {
      return newDb();
    }
  }

  function save(db) {
    try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
    catch (e) { return false; }
  }

  /** Дополняет старые записи полями, появившимися позже: чужие данные не теряем. */
  function migrate(db) {
    const base = newDb();
    for (const k of Object.keys(base)) if (db[k] === undefined) db[k] = base[k];
    for (const c of db.cases) {
      const cb = newCase();
      for (const k of Object.keys(cb)) if (c[k] === undefined && k !== 'parties' && k !== 'deals') c[k] = cb[k];
      c.parties = c.parties || [];
      c.deals = c.deals || [];
      for (const d of c.deals) {
        const proto = newDeal();
        for (const k of Object.keys(proto)) if (d[k] === undefined) d[k] = proto[k];
        d.object = Object.assign(newObject(d.object && d.object.kind), d.object || {});
        d.statement = Object.assign(newStatement(), d.statement || {});
      }
    }
    db.schema = SCHEMA;
    return db;
  }

  /* ================= стороны ================= */

  const partyName = (p) => {
    if (!p) return '';
    if (p.kind === 'org') return p.nameFull || p.nameShort || '';
    if (p.kind === 'ip') return p.fio ? 'индивидуальный предприниматель ' + p.fio : '';
    return p.fio || '';
  };

  const partyShort = (p) => {
    if (!p) return '';
    if (p.kind === 'org') return p.nameShort || p.nameFull || '';
    if (p.kind === 'ip') return p.fio ? 'ИП ' + p.fio : '';
    return p.fio || '';
  };

  const partyInn = (p) => (p ? p.inn : '') || '';
  const partyOgrn = (p) => (p ? (p.kind === 'ip' ? p.ogrnip : p.ogrn) : '') || '';
  const partyAddress = (p) => (p ? (p.kind === 'org' ? (p.addressLegal || p.addressPostal) : p.address) : '') || '';

  /** «ИНН 1234567890, ОГРН 1234567890123» — только то, что заполнено. */
  function partyRequisites(p) {
    if (!p) return '';
    const bits = [];
    if (partyInn(p)) bits.push('ИНН ' + partyInn(p));
    if (partyOgrn(p)) bits.push((p.kind === 'ip' ? 'ОГРНИП ' : 'ОГРН ') + partyOgrn(p));
    if (p.kind === 'person' && p.birthDate) bits.push('дата рождения ' + D.dateShort(p.birthDate));
    return bits.join(', ');
  }

  const findParty = (kase, id) => (kase.parties || []).find((p) => p.id === id) || null;
  const debtorOf = (kase) => findParty(kase, kase.debtorId);
  const counterpartyOf = (kase, deal) => findParty(kase, deal.counterpartyId);

  /* ================= описание объекта ================= */

  function objectDescription(deal) {
    const o = deal.object || {};
    const bits = [];
    if (o.kind === 'realty') {
      if (o.realtyKind) bits.push(o.realtyKind.toLowerCase());
      if (o.address) bits.push('расположенный по адресу: ' + o.address);
      if (o.cadastral) bits.push('кадастровый номер ' + o.cadastral);
      if (o.area) bits.push('площадью ' + o.area + ' кв. м');
      if (o.purpose) bits.push('назначение: ' + o.purpose);
      if (o.features) bits.push(o.features);
    } else if (o.kind === 'vehicle') {
      const car = [o.brand, o.model].filter(Boolean).join(' ');
      if (car) bits.push('транспортное средство ' + car);
      if (o.year) bits.push(o.year + ' года выпуска');
      if (o.vin) bits.push('VIN ' + o.vin);
      if (o.plate) bits.push('государственный регистрационный знак ' + o.plate);
    } else if (o.kind === 'money') {
      if (o.sum !== '' && o.sum != null) bits.push('денежные средства в размере ' + D.money(o.sum) + ' руб.');
      if (o.orderNumber) bits.push('платёжное поручение № ' + o.orderNumber);
      if (o.payDate) bits.push('от ' + D.dateShort(o.payDate));
      if (o.accountFrom) bits.push('со счёта ' + o.accountFrom);
      if (o.accountTo) bits.push('на счёт ' + o.accountTo);
      if (o.purposeText) bits.push('назначение платежа: ' + o.purposeText);
    } else {
      if (o.description) bits.push(o.description);
    }
    return bits.join(', ');
  }

  /** Стоимость объекта: явно указанная, а если её нет — сумма сделки. */
  function objectValue(deal) {
    const o = deal.object || {};
    if (o.value !== '' && o.value != null) return o.value;
    if (o.kind === 'money' && o.sum !== '' && o.sum != null) return o.sum;
    return deal.amount;
  }

  const dealTypeName = (deal) => deal.type === 'other'
    ? (deal.typeOther || 'иная сделка')
    : D.nameOf(D.DEAL_TYPES, deal.type);

  const dealTypeGen = (deal) => {
    if (deal.type === 'other') return deal.typeOther || 'иной сделки';
    const t = D.byId(D.DEAL_TYPES, deal.type);
    return t ? t.gen : '';
  };

  /** «за 8 месяцев», «за 2 года 3 месяца» — расстояние от сделки до возбуждения дела. */
  function periodBefore(dealDate, caseStart) {
    if (!dealDate || !caseStart) return '';
    const a = new Date(dealDate + 'T00:00:00Z'), b = new Date(caseStart + 'T00:00:00Z');
    if (isNaN(a) || isNaN(b) || b < a) return '';
    let months = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + (b.getUTCMonth() - a.getUTCMonth());
    if (b.getUTCDate() < a.getUTCDate()) months--;
    if (months < 1) {
      const days = Math.round((b - a) / 86400000);
      return 'за ' + days + ' ' + D.plural(days, 'день', 'дня', 'дней');
    }
    const y = Math.floor(months / 12), m = months % 12;
    const out = [];
    if (y) out.push(y + ' ' + D.plural(y, 'год', 'года', 'лет'));
    if (m) out.push(m + ' ' + D.plural(m, 'месяц', 'месяца', 'месяцев'));
    return 'за ' + out.join(' ');
  }

  const grounds = (list, ids, other) => (ids || [])
    .map((id) => (id === 'other' ? (other || 'иное') : D.nameOf(list, id)))
    .filter(Boolean).join('; ').toLowerCase();

  /* ================= контекст переменных ================= */

  /**
   * Плоский набор {{ПЕРЕМЕННАЯ}} → строка. Один источник для предпросмотра,
   * DOCX и печати: расхождений между тем, что видно, и тем, что выгружено,
   * быть не должно.
   */
  function context(db, kase, deal) {
    const debtor = debtorOf(kase);
    const cp = counterpartyOf(kase, deal);
    const proc = D.byId(D.PROCEDURES, kase.procedure);
    const o = deal.object || {};
    const perf = D.byId(D.PERFORMANCE, deal.performance.state);
    const counter = D.byId(D.COUNTER, deal.counter.state);
    const gap = gapValue(deal);

    const v = {
      CASE_NUMBER: kase.number,
      COURT_NAME: kase.court,
      COURT_ADDRESS: kase.courtAddress,
      PROCEDURE: proc ? proc.name : '',
      PROCEDURE_DATE: D.dateLong(kase.procedureDate),
      JUDICIAL_ACT: kase.judicialAct,
      CASE_START_DATE: D.dateLong(kase.caseStartDate),
      MANAGER_ROLE: proc ? proc.manager : '',
      MANAGER_ROLE_GEN: proc ? proc.managerGen : '',
      MANAGER_ROLE_INS: proc ? proc.managerIns : '',
      MANAGER_NAME: kase.managerName || db.profile.name,
      MANAGER_ADDRESS: kase.managerAddress || db.profile.address,
      MANAGER_CONTACTS: kase.managerContacts || db.profile.contacts,
      MANAGER_SRO: kase.managerSro || db.profile.sro,
      CREDITORS_SUM: D.money(kase.creditorsSum),

      DEBTOR_NAME: partyName(debtor),
      DEBTOR_SHORT: partyShort(debtor),
      DEBTOR_INN: partyInn(debtor),
      DEBTOR_OGRN: partyOgrn(debtor),
      DEBTOR_ADDRESS: partyAddress(debtor),
      DEBTOR_REQUISITES: partyRequisites(debtor),

      COUNTERPARTY_NAME: partyName(cp),
      COUNTERPARTY_SHORT: partyShort(cp),
      COUNTERPARTY_INN: partyInn(cp),
      COUNTERPARTY_OGRN: partyOgrn(cp),
      COUNTERPARTY_ADDRESS: partyAddress(cp),
      COUNTERPARTY_REQUISITES: partyRequisites(cp),

      DEAL_TYPE: dealTypeName(deal),
      DEAL_TYPE_GEN: dealTypeGen(deal),
      DEAL_DATE: D.dateLong(deal.date),
      DEAL_DATE_SHORT: D.dateShort(deal.date),
      DEAL_NUMBER: deal.number,
      CONTRACT_DATE: D.dateLong(deal.contractDate || deal.date),
      DEAL_AMOUNT: D.money(deal.amount),
      DEAL_AMOUNT_WORDS: D.moneyWords(deal.amount),
      DEAL_CURRENCY: D.nameOf(D.CURRENCIES, deal.currency),
      DEAL_SUBJECT: deal.subject || objectDescription(deal),
      DEAL_PERIOD: periodBefore(deal.date, kase.caseStartDate),

      OBJECT_TYPE: D.nameOf(D.OBJECT_TYPES, o.kind).toLowerCase(),
      OBJECT_DESCRIPTION: objectDescription(deal),
      OBJECT_ADDRESS: o.address,
      CADASTRAL_NUMBER: o.cadastral,
      OBJECT_AREA: o.area,
      OBJECT_VALUE: D.money(objectValue(deal)),
      OBJECT_VALUE_WORDS: D.moneyWords(objectValue(deal)),
      VEHICLE_VIN: o.vin,
      VEHICLE_PLATE: o.plate,
      PAYMENT_ORDER: o.orderNumber,
      PAYMENT_PURPOSE: o.purposeText,
      PAYMENT_DATE: D.dateLong(o.payDate),
      ACCOUNT_FROM: o.accountFrom,
      ACCOUNT_TO: o.accountTo,

      PERFORMANCE_STATE: perf ? perf.name.toLowerCase() : '',
      PERFORMANCE_DATE: D.dateLong(deal.performance.date),
      PERFORMANCE_METHOD: deal.performance.method,
      COUNTER_STATE: counter ? counter.name.toLowerCase() : '',
      DEBTOR_VALUE: D.money(deal.counter.debtorValue),
      COUNTER_VALUE: D.money(deal.counter.counterValue),
      COUNTER_GAP: D.money(gap),
      COUNTER_GAP_WORDS: D.moneyWords(gap),
      COUNTER_NOTE: deal.counter.note || deal.counter.reasons,

      AFFILIATION_GROUNDS: grounds(D.AFFILIATION_GROUNDS, deal.affiliationGrounds, deal.affiliationNote),
      AFFILIATION_NOTE: deal.affiliationNote,
      PREFERENCE_GROUNDS: grounds(D.PREFERENCE_GROUNDS, deal.preferenceGrounds, deal.preferenceNote),
      PREFERENCE_NOTE: deal.preferenceNote,
      HARM_NOTE: deal.harmNote,
      AWARENESS_NOTE: deal.awarenessNote,
      CIRCUMSTANCES: deal.circumstances,

      TODAY: D.dateLong(new Date().toISOString().slice(0, 10)),
      ATTACHMENTS: attachments(deal).map((a, i) => (i + 1) + '. ' + a).join('\n')
    };

    for (const k of Object.keys(v)) if (v[k] == null) v[k] = '';
    return v;
  }

  /** Разница между исполнением должника и встречным исполнением. */
  function gapValue(deal) {
    const a = Number(deal.counter.debtorValue);
    if (deal.counter.debtorValue === '' || !isFinite(a)) return '';
    const b = Number(deal.counter.counterValue);
    const got = deal.counter.counterValue === '' ? 0 : (isFinite(b) ? b : 0);
    return a - got;
  }

  /* ================= условия ================= */

  /** Контекст для условий блоков: `deal.unequal = true`, `case.procedure = bankruptcy`. */
  function condContext(kase, deal) {
    return {
      deal: {
        unequal: !!deal.flags.unequal,
        harm: !!deal.flags.harm,
        affiliation: !!deal.flags.affiliation,
        preference: !!deal.flags.preference,
        awareness: !!deal.flags.awareness,
        hasUnequalPerformance: !!deal.flags.unequal,
        type: deal.type,
        objectType: (deal.object || {}).kind,
        performance: deal.performance.state,
        counter: deal.counter.state,
        amount: Number(deal.amount) || 0,
        documents: (deal.documents || []).length
      },
      case: {
        procedure: kase.procedure,
        number: kase.number
      }
    };
  }

  const LEAF = /^\s*([A-Za-z_][\w.]*)\s*(>=|<=|!=|=|>|<)\s*(.+?)\s*$/;

  /**
   * Условия из ТЗ (§11) записаны человекочитаемо, поэтому и разбор здесь
   * простой: сравнения, склеенные AND / OR. Никакого eval — выражение
   * приходит из редактируемого шаблона, а исполнять чужой код не нужно.
   */
  function evalCondition(expr, ctx) {
    const s = String(expr || '').trim();
    if (!s) return true;
    if (/\sOR\s/i.test(s)) return s.split(/\s+OR\s+/i).some((p) => evalCondition(p, ctx));
    if (/\sAND\s/i.test(s)) return s.split(/\s+AND\s+/i).every((p) => evalCondition(p, ctx));

    const m = LEAF.exec(s);
    if (!m) return true;              // непонятное условие блок не прячет
    const left = m[1].split('.').reduce((o, k) => (o == null ? o : o[k]), ctx);
    const right = literal(m[3]);
    const op = m[2];

    if (op === '=') return eq(left, right);
    if (op === '!=') return !eq(left, right);
    const a = Number(left), b = Number(right);
    if (!isFinite(a) || !isFinite(b)) return false;
    return op === '>' ? a > b : op === '<' ? a < b : op === '>=' ? a >= b : a <= b;
  }

  function literal(raw) {
    const t = raw.trim().replace(/^['"]|['"]$/g, '');
    if (/^true$/i.test(t)) return true;
    if (/^false$/i.test(t)) return false;
    if (t !== '' && isFinite(Number(t))) return Number(t);
    return t;
  }

  const eq = (a, b) => (typeof b === 'boolean' ? !!a === b : String(a == null ? '' : a) === String(b));

  /* ================= шаблонизатор ================= */

  // Метки незаполненного значения. Управляющие символы выбраны намеренно:
  // в юридическом тексте их не бывает, поэтому подсветка не сработает
  // случайно на данных, введённых пользователем.
  const MISS_A = '\u0001', MISS_B = '\u0002';
  const VAR_RE = /\{\{\s*([A-Z_][A-Z0-9_]*)\s*\}\}/g;

  /**
   * Подстановка переменных. mark=true оставляет метку вокруг незаполненного
   * значения — предпросмотр подсвечивает такие места; в DOCX и на печать
   * идёт прочерк, чтобы документ можно было дозаполнить от руки.
   */
  function render(tpl, vars, mark) {
    return String(tpl || '').replace(VAR_RE, (all, name) => {
      const val = vars[name];
      if (val != null && String(val).trim() !== '') return String(val);
      const label = D.VAR_INDEX.has(name) ? D.VAR_INDEX.get(name).label : name;
      return mark ? MISS_A + label + MISS_B : '__________';
    });
  }

  /** Какие переменные блока остались незаполненными. */
  function missingVars(tpl, vars) {
    const out = [];
    String(tpl || '').replace(VAR_RE, (all, name) => {
      const val = vars[name];
      if ((val == null || String(val).trim() === '') && !out.includes(name)) out.push(name);
      return all;
    });
    return out;
  }

  /* ================= приложения ================= */

  /** «Договор купли-продажи № 15 от 15.04.2025» — строка приложения. */
  function documentLine(doc) {
    const type = D.nameOf(D.DOC_TYPES, doc.type);
    const bits = [doc.name || type];
    if (doc.number) bits.push('№ ' + doc.number);
    if (doc.date) bits.push('от ' + D.dateShort(doc.date));
    let line = bits.join(' ');
    if (doc.description) line += ' — ' + doc.description;
    return line;
  }

  /** Сквозной список приложений: нумерация пересобирается при каждом изменении (§16). */
  function attachments(deal) {
    return (deal.documents || []).filter((d) => d.attach !== false).map(documentLine);
  }

  /* ================= блоки заявления ================= */

  /** Библиотека = стандартные блоки (с учётом правок) + пользовательские. */
  function library(db) {
    const has = (id) => Object.prototype.hasOwnProperty.call(db.edits || {}, id);
    const std = D.BLOCKS.map((b) => Object.assign({}, b, {
      template: has(b.id) ? db.edits[b.id] : b.template,
      edited: has(b.id)
    }));
    return std.concat((db.customBlocks || []).map((b) => Object.assign({ custom: true }, b)));
  }

  /**
   * Состав заявления. При первом заходе строится из библиотеки: обязательные
   * блоки включены, условные — по фактам сделки. Дальше решает пользователь,
   * и его выбор не перетирается.
   */
  function statementBlocks(db, kase, deal) {
    const lib = library(db);
    const st = deal.statement;
    const ctx = condContext(kase, deal);
    const known = new Map(lib.map((b) => [b.id, b]));

    if (!st.blocks.length) {
      st.blocks = lib.map((b, i) => ({
        id: b.id, order: i,
        enabled: b.required ? true : (b.condition ? evalCondition(b.condition, ctx) : true),
        text: null
      }));
    } else {
      // Новый блок в библиотеке (например, свой) должен появиться в конце,
      // а не исчезнуть молча.
      const have = new Set(st.blocks.map((x) => x.id));
      let order = st.blocks.length;
      for (const b of lib) {
        if (have.has(b.id)) continue;
        st.blocks.push({ id: b.id, order: order++, enabled: !!b.required, text: null });
      }
      st.blocks = st.blocks.filter((x) => known.has(x.id));
    }

    st.blocks.sort((a, b) => a.order - b.order);
    st.blocks.forEach((x, i) => { x.order = i; });

    return st.blocks.map((x) => {
      const b = known.get(x.id);
      return {
        ref: x,
        id: b.id, name: b.name, description: b.description || '', group: b.group || 'Прочее',
        align: b.align || 'justify', bold: !!b.bold, required: !!b.required,
        condition: b.condition || '', auto: b.auto || '', custom: !!b.custom, edited: !!b.edited,
        template: x.text != null ? x.text : b.template,
        overridden: x.text != null,
        enabled: !!x.enabled,
        available: b.condition ? evalCondition(b.condition, ctx) : true
      };
    });
  }

  /**
   * Готовый документ: массив абзацев с выравниванием. На этом виде строятся
   * и предпросмотр, и печать, и DOCX — три представления одного результата.
   */
  function buildDocument(db, kase, deal, opts) {
    const mark = !!(opts && opts.mark);
    const vars = context(db, kase, deal);
    const out = [];

    for (const b of statementBlocks(db, kase, deal)) {
      if (!b.enabled) continue;
      const lines = render(b.template, vars, mark).split('\n').map((s) => s.replace(/[ \t]+$/, ''));
      let first = true;
      for (const line of lines) {
        // Пустые строки шаблона — разделители внутри блока. Пустой абзац
        // в начале и в конце документа выглядел бы дырой, поэтому в вывод
        // попадают только те, между которыми есть текст.
        if (line.trim() === '') {
          if (!first && out.length && out[out.length - 1].text.trim() !== '') out.push({ text: '', align: b.align, bold: b.bold, blockId: b.id });
          continue;
        }
        out.push({ text: line, align: b.align, bold: b.bold, blockId: b.id, first: first });
        first = false;
      }
      if (out.length && out[out.length - 1].text.trim() === '') out.pop();
    }
    return out;
  }

  /** Плоский текст документа — для версий и сравнения. */
  const documentText = (db, kase, deal) =>
    buildDocument(db, kase, deal, { mark: false }).map((p) => p.text).join('\n');

  /* ================= проверка ================= */

  /**
   * Ошибки не дают сформировать документ, предупреждения — только сигналят.
   * Все проверки — обычные правила, никакой «оценки перспектив» (§28).
   */
  function validate(db, kase, deal) {
    const errors = [], warnings = [];
    const debtor = debtorOf(kase);
    const cp = counterpartyOf(kase, deal);
    const req = (cond, field, where) => { if (!cond) errors.push({ field, where }); };

    req(kase.number, 'Номер дела', 'case');
    req(kase.court, 'Наименование суда', 'case');
    req(partyName(debtor), 'Наименование должника', 'case');
    req(kase.managerName || db.profile.name, 'ФИО арбитражного управляющего', 'case');
    req(deal.date, 'Дата сделки', 'deal');
    req(deal.amount !== '' && deal.amount != null, 'Сумма сделки', 'deal');
    req(cp && partyName(cp), 'Контрагент по сделке', 'deal');

    const blocks = statementBlocks(db, kase, deal);
    if (!blocks.some((b) => b.enabled)) errors.push({ field: 'Не выбран ни один блок заявления', where: 'builder' });

    // Логические проверки (§14)
    const perfDate = deal.performance.date;
    const base = deal.contractDate || deal.date;
    if (perfDate && base && perfDate < base) {
      warnings.push('Дата исполнения сделки (' + D.dateShort(perfDate) +
        ') раньше даты заключения договора (' + D.dateShort(base) + ').');
    }
    if (deal.date && kase.caseStartDate && deal.date > kase.caseStartDate) {
      warnings.push('Сделка совершена после возбуждения дела о банкротстве — периоды подозрительности ' +
        'по статье 61.2 считаются от даты принятия заявления.');
    }
    if (deal.contractDate && deal.date && deal.contractDate > deal.date) {
      warnings.push('Дата договора позже даты сделки.');
    }
    const o = deal.object || {};
    if (o.kind === 'money' && o.sum !== '' && deal.amount !== '' && Number(o.sum) !== Number(deal.amount)) {
      warnings.push('Сумма сделки (' + D.money(deal.amount) + ' руб.) отличается от суммы платежа (' +
        D.money(o.sum) + ' руб.).');
    }

    const on = (id) => blocks.some((b) => b.id === id && b.enabled);
    if (on('unequal') && (deal.counter.debtorValue === '' || deal.counter.counterValue === '')) {
      warnings.push('Выбран блок «Неравноценное встречное исполнение», но не заполнены стоимости ' +
        'исполнения должника и встречного исполнения.');
    }
    if (on('affiliation') && !(deal.affiliationGrounds || []).length) {
      warnings.push('Выбран блок «Заинтересованность сторон», но основания заинтересованности не указаны.');
    }
    if (on('preference') && !(deal.preferenceGrounds || []).length) {
      warnings.push('Выбран блок «Предпочтительное удовлетворение», но основания предпочтения не указаны.');
    }
    if (on('attachments') && !attachments(deal).length) {
      warnings.push('Блок «Приложения» включён, но к сделке не приложено ни одного документа.');
    }
    if (deal.counter.state === 'partial' && deal.counter.counterValue === '') {
      warnings.push('Встречное исполнение указано как частичное, но его стоимость не заполнена.');
    }

    // Незаполненные переменные включённых блоков
    const vars = context(db, kase, deal);
    const missing = new Set();
    for (const b of blocks) if (b.enabled) for (const n of missingVars(b.template, vars)) missing.add(n);

    return { errors, warnings, missingVars: [...missing], ok: errors.length === 0 };
  }

  /* ================= версии ================= */

  function saveVersion(db, kase, deal, note) {
    const st = deal.statement;
    st.seq = (st.seq || 0) + 1;
    st.versions.push({
      id: uid(), no: st.seq, createdAt: now(), note: note || '',
      text: documentText(db, kase, deal),
      blocks: JSON.parse(JSON.stringify(st.blocks))
    });
    return st.versions[st.versions.length - 1];
  }

  function restoreVersion(deal, versionId) {
    const v = deal.statement.versions.find((x) => x.id === versionId);
    if (!v) return false;
    deal.statement.blocks = JSON.parse(JSON.stringify(v.blocks));
    return true;
  }

  /**
   * Построчное сравнение двух версий. Наибольшая общая подпоследовательность:
   * строки заявления длинные и почти не повторяются, поэтому простой LCS
   * даёт понятный человеку результат.
   */
  function diffLines(aText, bText) {
    const a = String(aText).split('\n'), b = String(bText).split('\n');
    const n = a.length, m = b.length;
    const w = m + 1;
    const dp = new Uint32Array((n + 1) * w);
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i * w + j] = a[i] === b[j]
          ? dp[(i + 1) * w + j + 1] + 1
          : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
      }
    }
    const out = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { out.push({ op: ' ', text: a[i] }); i++; j++; }
      else if (dp[(i + 1) * w + j] >= dp[i * w + j + 1]) { out.push({ op: '-', text: a[i] }); i++; }
      else { out.push({ op: '+', text: b[j] }); j++; }
    }
    while (i < n) out.push({ op: '-', text: a[i++] });
    while (j < m) out.push({ op: '+', text: b[j++] });
    return out;
  }

  /* ================= копирование сделки ================= */

  /** «Создать на основе этой сделки» (§18): стороны и структура сохраняются. */
  function cloneDeal(deal) {
    const copy = JSON.parse(JSON.stringify(deal));
    copy.id = uid();
    copy.createdAt = copy.updatedAt = now();
    // Реквизиты конкретной сделки — то немногое, что заведомо другое.
    copy.number = '';
    copy.date = '';
    copy.contractDate = '';
    copy.documents = [];
    copy.statement.versions = [];
    copy.statement.seq = 0;
    copy.statement.status = 'draft';
    return copy;
  }

  globalThis.ZStore = {
    KEY, SCHEMA, uid, now,
    newDb, newCase, newParty, newDeal, newObject, newDocument, newStatement,
    load, save, migrate,
    partyName, partyShort, partyInn, partyOgrn, partyAddress, partyRequisites,
    findParty, debtorOf, counterpartyOf,
    objectDescription, objectValue, dealTypeName, dealTypeGen, periodBefore, gapValue,
    context, condContext, evalCondition, render, missingVars,
    documentLine, attachments,
    library, statementBlocks, buildDocument, documentText,
    validate, saveVersion, restoreVersion, diffLines, cloneDeal,
    MISS_A, MISS_B
  };
})();
</script>
<script>/*
 * Выгрузка готового заявления: DOCX и раскладка листов A4 для печати в PDF.
 *
 * DOCX собирается вручную, без библиотек. Формат .docx — это ZIP из
 * нескольких XML-файлов, и написать их оказывается дешевле, чем тащить
 * в офлайновую страницу мегабайт стороннего кода. Сжатие не используется:
 * заявление весит десятки килобайт, а «сохранение без сжатия» — легальный
 * режим ZIP, который Word открывает наравне с обычным.
 *
 * PDF получается печатью: листы раскладываются здесь по фактическим высотам
 * абзацев, поэтому в файле не появляется ни срезанного текста, ни пустот,
 * а нумерация страниц совпадает с тем, что видно в предпросмотре.
 */
(function () {
  'use strict';

  const NS_W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const NS_CT = 'http://schemas.openxmlformats.org/package/2006/content-types';
  const NS_REL = 'http://schemas.openxmlformats.org/package/2006/relationships';

  const enc = new TextEncoder();
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* ================= ZIP ================= */

  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /** Дата и время в формате MS-DOS — два 16-битных поля заголовка ZIP. */
  function dosStamp(d) {
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    return { time, date };
  }

  /**
   * Собирает ZIP из [{name, data}] без сжатия (метод 0).
   * Имена частей .docx — только ASCII, поэтому флаг UTF-8 роли не играет,
   * но выставлен: так архив корректен и для внешних инструментов.
   */
  function zip(files) {
    const stamp = dosStamp(new Date());
    const parts = [];
    const central = [];
    let offset = 0;

    for (const f of files) {
      const nameBytes = enc.encode(f.name);
      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const crc = crc32(data);

      const local = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034B50, true);
      lv.setUint16(4, 20, true);          // версия для распаковки
      lv.setUint16(6, 0x0800, true);      // имена в UTF-8
      lv.setUint16(8, 0, true);           // метод: без сжатия
      lv.setUint16(10, stamp.time, true);
      lv.setUint16(12, stamp.date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      local.set(nameBytes, 30);

      parts.push(local, data);

      const cd = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014B50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, stamp.time, true);
      cv.setUint16(14, stamp.date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      cd.set(nameBytes, 46);
      central.push(cd);

      offset += local.length + data.length;
    }

    const cdSize = central.reduce((n, c) => n + c.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054B50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    const all = parts.concat(central, [end]);
    const total = all.reduce((n, p) => n + p.length, 0);
    const out = new Uint8Array(total);
    let at = 0;
    for (const p of all) { out.set(p, at); at += p.length; }
    return out;
  }

  /* ================= DOCX ================= */

  // Размеры в твипах (1/20 пункта). Поля — по ГОСТ Р 7.0.97 для документов,
  // подаваемых в суд: слева 30 мм под подшивку, справа 15, сверху и снизу 20.
  const PAGE = { w: 11906, h: 16838, top: 1134, right: 850, bottom: 1134, left: 1701 };
  const INDENT = 709;          // абзацный отступ 1,25 см
  const LINE = 360;            // полуторный интервал

  const ALIGN = { justify: 'both', center: 'center', right: 'right', left: 'left' };

  function paragraphXml(p) {
    const jc = ALIGN[p.align] || 'both';
    // Красная строка нужна только в связном тексте: в шапке, заголовке
    // и подписи она разъезжается.
    const indent = jc === 'both' || jc === 'left' ? `<w:ind w:firstLine="${INDENT}"/>` : '';
    const pPr = `<w:pPr><w:spacing w:after="0" w:line="${LINE}" w:lineRule="auto"/>` +
      `<w:jc w:val="${jc}"/>${indent}</w:pPr>`;

    if (!p.text.trim()) return `<w:p>${pPr}</w:p>`;

    const rPr = p.bold ? '<w:rPr><w:b/></w:rPr>' : '';
    const runs = String(p.text).split('\t')
      .map((chunk, i) => (i ? '<w:r><w:tab/></w:r>' : '') +
        `<w:r>${rPr}<w:t xml:space="preserve">${esc(chunk)}</w:t></w:r>`)
      .join('');
    return `<w:p>${pPr}${runs}</w:p>`;
  }

  function documentXml(paras) {
    const body = paras.map(paragraphXml).join('');
    const sect = '<w:sectPr>' +
      '<w:footerReference w:type="default" r:id="rId2"/>' +
      `<w:pgSz w:w="${PAGE.w}" w:h="${PAGE.h}"/>` +
      `<w:pgMar w:top="${PAGE.top}" w:right="${PAGE.right}" w:bottom="${PAGE.bottom}" ` +
      `w:left="${PAGE.left}" w:header="708" w:footer="708" w:gutter="0"/>` +
      '</w:sectPr>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      `<w:document xmlns:w="${NS_W}" xmlns:r="${NS_R}"><w:body>${body}${sect}</w:body></w:document>`;
  }

  const STYLES_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<w:styles xmlns:w="${NS_W}">` +
    '<w:docDefaults><w:rPrDefault><w:rPr>' +
    '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>' +
    '<w:sz w:val="28"/><w:szCs w:val="28"/><w:lang w:val="ru-RU"/>' +
    '</w:rPr></w:rPrDefault>' +
    `<w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="${LINE}" w:lineRule="auto"/></w:pPr></w:pPrDefault>` +
    '</w:docDefaults>' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>' +
    '</w:styles>';

  // Номер страницы в колонтитуле — поле PAGE: Word пересчитывает его сам,
  // и нумерация остаётся верной после любой правки текста.
  const FOOTER_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<w:ftr xmlns:w="${NS_W}" xmlns:r="${NS_R}">` +
    '<w:p><w:pPr><w:jc w:val="center"/></w:pPr>' +
    '<w:r><w:fldChar w:fldCharType="begin"/></w:r>' +
    '<w:r><w:instrText xml:space="preserve"> PAGE </w:instrText></w:r>' +
    '<w:r><w:fldChar w:fldCharType="separate"/></w:r>' +
    '<w:r><w:t>1</w:t></w:r>' +
    '<w:r><w:fldChar w:fldCharType="end"/></w:r>' +
    '</w:p></w:ftr>';

  const CONTENT_TYPES =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<Types xmlns="${NS_CT}">` +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
    '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>' +
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
    '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>' +
    '</Types>';

  const ROOT_RELS =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<Relationships xmlns="${NS_REL}">` +
    `<Relationship Id="rId1" Type="${NS_R}/officeDocument" Target="word/document.xml"/>` +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
    `<Relationship Id="rId3" Type="${NS_R}/extended-properties" Target="docProps/app.xml"/>` +
    '</Relationships>';

  const DOC_RELS =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<Relationships xmlns="${NS_REL}">` +
    `<Relationship Id="rId1" Type="${NS_R}/styles" Target="styles.xml"/>` +
    `<Relationship Id="rId2" Type="${NS_R}/footer" Target="footer1.xml"/>` +
    '</Relationships>';

  function coreXml(title) {
    const iso = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +
      'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" ' +
      'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      `<dc:title>${esc(title)}</dc:title>` +
      `<dcterms:created xsi:type="dcterms:W3CDTF">${iso}</dcterms:created>` +
      `<dcterms:modified xsi:type="dcterms:W3CDTF">${iso}</dcterms:modified>` +
      '</cp:coreProperties>';
  }

  const APP_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties">' +
    '<Application>Конструктор заявлений</Application></Properties>';

  /** Готовый .docx как Uint8Array. */
  function docxBytes(paras, title) {
    return zip([
      { name: '[Content_Types].xml', data: CONTENT_TYPES },
      { name: '_rels/.rels', data: ROOT_RELS },
      { name: 'docProps/core.xml', data: coreXml(title || 'Заявление') },
      { name: 'docProps/app.xml', data: APP_XML },
      { name: 'word/_rels/document.xml.rels', data: DOC_RELS },
      { name: 'word/document.xml', data: documentXml(paras) },
      { name: 'word/styles.xml', data: STYLES_XML },
      { name: 'word/footer1.xml', data: FOOTER_XML }
    ]);
  }

  /* ================= листы A4 для печати ================= */

  const MM = 3.7795275591;                     // px в мм при 96 dpi
  const SHEET = { w: 210, h: 297, top: 20, right: 15, bottom: 20, left: 30 };
  const CONTENT_H = SHEET.h - SHEET.top - SHEET.bottom;

  const paraHtml = (p, i) =>
    `<p class="dp ${p.align}${p.bold ? ' b' : ''}" data-i="${i}">${esc(p.text) || '&nbsp;'}</p>`;

  /**
   * Раскладка по листам. Высоты не прикидываются, а измеряются: абзацы
   * рендерятся в скрытом контейнере той же ширины, и только потом
   * распределяются по страницам. Иначе на длинных заявлениях накапливается
   * ошибка и последняя строка листа уезжает под обрез.
   */
  function buildSheets(paras, opts) {
    const doc = (opts && opts.document) || globalThis.document;
    const box = doc.createElement('div');
    box.className = 'docmeasure';
    box.style.width = (SHEET.w - SHEET.left - SHEET.right) + 'mm';
    box.innerHTML = paras.map(paraHtml).join('');
    doc.body.appendChild(box);

    const limit = CONTENT_H * MM;
    const nodes = [...box.children];
    const pages = [[]];
    let used = 0;

    for (let i = 0; i < nodes.length; i++) {
      const h = nodes[i].getBoundingClientRect().height;
      // Абзац выше листа не разрезать нечем — отдаём его странице целиком
      // и позволяем браузеру перенести хвост.
      if (used > 0 && used + h > limit) { pages.push([]); used = 0; }
      pages[pages.length - 1].push(i);
      used += h;
    }
    box.remove();

    const total = pages.length;
    return pages.map((idx, n) =>
      '<section class="sheet">' +
      '<div class="sheetbody">' + idx.map((i) => paraHtml(paras[i], i)).join('') + '</div>' +
      `<div class="sheetnum">${n + 1} из ${total}</div>` +
      '</section>').join('');
  }

  /* ================= сохранение файла ================= */

  function download(bytes, filename, mime) {
    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  /** Имя файла без символов, запрещённых в Windows. */
  const safeName = (s) => String(s || 'Заявление').replace(/[\\/:*?"<>|]/g, ' ')
    .replace(/\s+/g, ' ').trim().slice(0, 90) || 'Заявление';

  globalThis.ZDoc = {
    zip, crc32, docxBytes, documentXml, buildSheets, download, safeName,
    SHEET, CONTENT_H, MM,
    DOCX_MIME: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  };
})();
</script>
<script>/*
 * Интерфейс конструктора.
 *
 * Устройство: данные вводятся один раз в карточке дела и карточке сделки,
 * дальше человек только отвечает на вопросы и отмечает блоки, а текст
 * собирается сам. Поэтому основной экран — не редактор, а анкета: формы
 * и переключатели слева, готовый документ справа.
 *
 * Разметка перерисовывается целиком на смену экрана и на смену ответа,
 * влияющего на состав полей. Набор текста перерисовку не вызывает — иначе
 * каретка прыгала бы на каждой букве.
 */
(function () {
  'use strict';

  const D = globalThis.ZData;
  const S = globalThis.ZStore;
  const X = globalThis.ZDoc;

  let db = S.load();

  /* ================= служебное ================= */

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => [...(root || document).querySelectorAll(sel)];
  const esc = (s) => String(s == null ? '' : s)
    .replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const attr = (s) => esc(s).replace(/'/g, '&#39;');

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (!S.save(db)) note('Не удалось сохранить: в браузере отключено локальное хранилище.');
    }, 200);
  }
  const saveNow = () => { clearTimeout(saveTimer); S.save(db); };

  /* ================= маршрут ================= */

  let route = { name: 'cases' };
  let tabs = { case: 'req', deal: 'main' };
  let openBlocks = new Set();

  function parseHash() {
    const raw = String(location.hash || '').replace(/^#\/?/, '');
    const p = raw.split('/').filter(Boolean).map(decodeURIComponent);
    if (!p.length) return { name: 'cases' };
    if (p[0] === 'case' && p[1]) return { name: 'case', caseId: p[1] };
    if (p[0] === 'deal' && p[2]) return { name: 'deal', caseId: p[1], dealId: p[2] };
    if (p[0] === 'builder' && p[2]) return { name: 'builder', caseId: p[1], dealId: p[2] };
    if (p[0] === 'blocks') return { name: 'blocks' };
    return { name: 'cases' };
  }

  const go = (hash) => { location.hash = hash; };

  const currentCase = () => db.cases.find((c) => c.id === route.caseId) || null;
  const currentDeal = () => {
    const c = currentCase();
    return c ? (c.deals.find((d) => d.id === route.dealId) || null) : null;
  };

  /* ================= привязка полей ================= */

  let editParty = null, editDoc = null, editBlock = null;

  function roots() {
    return {
      db: db, profile: db.profile,
      case: currentCase(), deal: currentDeal(),
      party: editParty, doc: editDoc, block: editBlock
    };
  }

  function resolve(path) {
    const seg = String(path).split('.');
    let o = roots()[seg[0]];
    for (let i = 1; i < seg.length - 1 && o; i++) o = o[seg[i]];
    return o ? { obj: o, key: seg[seg.length - 1] } : null;
  }

  const getPath = (path) => {
    const r = resolve(path);
    return r ? r.obj[r.key] : '';
  };

  function setPath(path, value) {
    const r = resolve(path);
    if (r) r.obj[r.key] = value;
  }

  /** «8 400 000,55» и «8400000.55» — одно и то же число. */
  const normMoney = (s) => String(s).replace(/\s|\u00A0/g, '').replace(',', '.');

  // Крупные суммы на плитках печатаются без копеек: две лишние цифры в кегле
  // 56 px забирают половину строки и ничего не добавляют.
  const nfInt = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
  const money0 = (v) => (v === '' || v == null || !isFinite(v)) ? '—' : nfInt.format(Math.round(Number(v)));

  /* ================= элементы формы ================= */

  function field(o) {
    const type = o.type || 'text';
    const val = o.value != null ? o.value : getPath(o.bind);
    if (o.readonly) {
      return `<div class="f${o.wide ? ' wide' : ''}"><label class="lb">${esc(o.label)}</label>` +
        `<input type="text" value="${attr(val)}" readonly tabindex="-1" ` +
        `style="background:var(--surface-2);color:var(--ink-2)"></div>`;
    }
    const req = o.required ? ' <span class="req">*</span>' : '';
    const cls = 'f' + (o.wide ? ' wide' : '');
    const bad = o.bad ? ' bad' : '';
    let control;

    if (type === 'select') {
      control = `<select data-bind="${attr(o.bind)}" class="${bad}">` +
        o.options.map((op) => `<option value="${attr(op.id)}"${String(op.id) === String(val) ? ' selected' : ''}>` +
          esc(op.name) + '</option>').join('') + '</select>';
    } else if (type === 'textarea') {
      control = `<textarea data-bind="${attr(o.bind)}" rows="${o.rows || 3}" ` +
        `placeholder="${attr(o.placeholder || '')}"${o.grow ? ' data-grow="1"' : ''}>${esc(val)}</textarea>`;
    } else {
      const kind = o.money ? ' data-kind="money"' : '';
      const list = o.list ? ` list="${attr(o.list)}"` : '';
      control = `<input type="${type}" data-bind="${attr(o.bind)}" value="${attr(val)}" ` +
        `placeholder="${attr(o.placeholder || '')}" class="${bad}"${kind}${list}>`;
    }

    return `<div class="${cls}"><label class="lb">${esc(o.label)}${req}</label>${control}` +
      (o.hint ? `<p class="hint">${esc(o.hint)}</p>` : '') + '</div>';
  }

  /** Переключатель «или — или» таблетками: и на телефоне попадаешь пальцем. */
  function radios(bind, options, value) {
    return '<div class="radios">' + options.map((op) =>
      `<label class="radio${String(op.id) === String(value) ? ' on' : ''}">` +
      `<input type="radio" data-bind="${attr(bind)}" value="${attr(op.id)}"` +
      (String(op.id) === String(value) ? ' checked' : '') + `>${esc(op.name)}</label>`).join('') + '</div>';
  }

  const yesNo = (bind, value) => radios(bind, [{ id: 'yes', name: 'Да' }, { id: 'no', name: 'Нет' }], value ? 'yes' : 'no');

  function checkList(bind, options, selected) {
    const set = new Set(selected || []);
    return options.map((op) =>
      `<label class="chk"><input type="checkbox" data-arr="${attr(bind)}" value="${attr(op.id)}"` +
      (set.has(op.id) ? ' checked' : '') + `><span>${esc(op.name)}</span></label>`).join('');
  }

  const dataList = (id, items) =>
    `<datalist id="${id}">` + items.map((s) => `<option value="${attr(s)}">`).join('') + '</datalist>';

  /* ================= экран «Мои дела» ================= */

  /** Сводка по делу: на неё опираются и карточка, и плитки. */
  function caseStats(c) {
    const ready = c.deals.filter((d) => d.statement.status === 'ready').length;
    return { deals: c.deals.length, ready: ready, draft: c.deals.length - ready, parties: c.parties.length };
  }

  function screenCases() {
    // Первый заход: то же приглашение, что экран загрузки у анализатора —
    // одно крупное действие слева и три шага справа.
    if (!db.cases.length) {
      return `<div class="up">
        <button class="drop" data-act="new-case">
          <span class="ic">+</span>
          <b>Новое дело</b>
          <span>Суд, номер, должник, управляющий — один раз на всё дело</span>
        </button>
        <div class="aside">
          <div class="t">
            <div class="steps">
              <div class="stp"><span class="n">1</span><div><b>Заведите дело</b>
                <span class="m">Реквизиты подставятся во все заявления внутри него.</span></div></div>
              <div class="stp"><span class="n">2</span><div><b>Добавьте сделку</b>
                <span class="m">Тип, объект, стороны и несколько вопросов об обстоятельствах.</span></div></div>
              <div class="stp"><span class="n">3</span><div><b>Соберите заявление</b>
                <span class="m">Отметьте блоки и скачайте DOCX или распечатайте в PDF.</span></div></div>
            </div>
          </div>
          <div class="t">
            <div class="k">Данные остаются у вас</div>
            <p class="m" style="font-size:13px;color:var(--ink-2)">Дела хранятся в этом браузере.
              Сервера у приложения нет — реквизиты должников и контрагентов никуда не отправляются,
              страница работает и без интернета.</p>
          </div>
        </div>
      </div>`;
    }

    const total = db.cases.reduce((a, c) => {
      const s = caseStats(c);
      return { deals: a.deals + s.deals, ready: a.ready + s.ready, draft: a.draft + s.draft };
    }, { deals: 0, ready: 0, draft: 0 });

    const cards = db.cases.map((c) => {
      const s = caseStats(c);
      return `<button class="t link casecard s4" data-go="#/case/${c.id}">
        <div class="no">${esc(c.number || 'номер не указан')}</div>
        <h3>${esc(S.partyName(S.debtorOf(c)) || 'Должник не указан')}</h3>
        <div class="m">${esc(D.nameOf(D.PROCEDURES, c.procedure))}${c.court ? ' · ' + esc(c.court) : ''}</div>
        <div class="strip">
          <div><b>${s.deals}</b>${D.plural(s.deals, 'сделка', 'сделки', 'сделок')}</div>
          <div><b>${s.ready}</b>готово</div>
          <div><b>${s.draft}</b>${D.plural(s.draft, 'черновик', 'черновика', 'черновиков')}</div>
        </div>
      </button>`;
    }).join('');

    return `<div class="bento anim">
      <div class="t hero s8">
        <div class="k">Мои дела</div>
        <div class="big">${db.cases.length}<small> ${D.plural(db.cases.length, 'дело', 'дела', 'дел')}</small></div>
        <p class="said">Реквизиты дела вводятся один раз и подставляются во все заявления внутри него —
          ни суд, ни ИНН должника, ни данные контрагента переписывать не нужно.</p>
        <div class="strip">
          <div><b>${total.deals}</b>${D.plural(total.deals, 'сделка', 'сделки', 'сделок')}</div>
          <div><b>${total.ready}</b>${D.plural(total.ready, 'заявление готово', 'заявления готовы', 'заявлений готово')}</div>
          <div><b>${total.draft}</b>${D.plural(total.draft, 'черновик', 'черновика', 'черновиков')}</div>
        </div>
        <div class="act"><button class="btn pri" data-act="new-case">+ Новое дело</button></div>
      </div>

      <div class="t s4">
        <div class="k">Как это работает</div>
        <div class="steps" style="margin-top:4px">
          <div class="stp"><span class="n">1</span><div><b>Дело</b>
            <span class="m">Суд, номер, должник, управляющий.</span></div></div>
          <div class="stp"><span class="n">2</span><div><b>Сделка</b>
            <span class="m">Объект, стороны, обстоятельства.</span></div></div>
          <div class="stp"><span class="n">3</span><div><b>Заявление</b>
            <span class="m">Блоки, предпросмотр, DOCX и PDF.</span></div></div>
        </div>
      </div>

      ${cards}
      <button class="t link s4" data-act="new-case"
        style="border-style:dashed;align-items:center;justify-content:center;min-height:132px;
               color:var(--ink-3);background:none;box-shadow:none">
        <span style="font-size:26px;line-height:1">+</span><span>Новое дело</span>
      </button>
    </div>`;
  }

  /* ================= экран дела ================= */

  const tab = (screen, id, name, count) =>
    `<button class="tab${tabs[screen] === id ? ' on' : ''}" data-tab="${screen}:${id}">${name}` +
    (count == null ? '' : `<span class="n">${count}</span>`) + '</button>';

  function screenCase() {
    const c = currentCase();
    if (!c) return notFound();
    const debtor = S.debtorOf(c);
    const s = caseStats(c);
    const pct = s.deals ? Math.round(s.ready / s.deals * 100) : 0;

    const head = `<div class="crumbs"><a href="#/">Мои дела</a><span>›</span>
        <span>${esc(c.number || 'без номера')}</span></div>
      <div class="bento anim">
        <div class="t hero s8">
          <div class="k">${esc(c.number || 'Номер дела не указан')}</div>
          <h2>${esc(S.partyName(debtor) || 'Новое дело')}</h2>
          <p class="said">${esc(D.nameOf(D.PROCEDURES, c.procedure))}${c.court ? ' · ' + esc(c.court) : ''}</p>
          <div class="strip">
            <div><b>${s.deals}</b>${D.plural(s.deals, 'сделка', 'сделки', 'сделок')}</div>
            <div><b>${s.ready}</b>${D.plural(s.ready, 'заявление готово', 'заявления готовы', 'заявлений готово')}</div>
            <div><b>${s.draft}</b>${D.plural(s.draft, 'черновик', 'черновика', 'черновиков')}</div>
            <div><b>${s.parties}</b>${D.plural(s.parties, 'сторона', 'стороны', 'сторон')}</div>
          </div>
          <div class="act"><button class="btn pri" data-act="new-deal">+ Добавить сделку</button></div>
        </div>

        <div class="t s4">
          <div class="k">Готовность заявлений</div>
          <div class="v">${pct}<small style="font-size:16px;color:var(--ink-3)"> %</small></div>
          <div class="meter"><i class="${pct === 100 ? 'done' : ''}" style="width:${pct}%"></i></div>
          <p class="m">${s.ready} из ${s.deals} ${D.plural(s.deals, 'сделки', 'сделок', 'сделок')} доведено до готового заявления.</p>
          <div style="margin-top:auto;padding-top:8px">
            <button class="btn btn-sm danger" data-act="del-case">Удалить дело</button>
          </div>
        </div>
      </div>

      <div class="tabs">
        ${tab('case', 'req', 'Реквизиты дела')}
        ${tab('case', 'parties', 'Стороны', c.parties.length)}
        ${tab('case', 'deals', 'Сделки', c.deals.length)}
      </div>`;

    const body = tabs.case === 'parties' ? casePartiesTab(c)
      : tabs.case === 'deals' ? caseDealsTab(c)
        : caseReqTab(c, debtor);

    return head + body;
  }

  function caseReqTab(c, debtor) {
    return `<div class="card">
        <h3>Суд и дело</h3>
        <p class="m">Эти сведения попадут в шапку каждого заявления по делу.</p>
        <div class="form">
          ${field({ label: 'Арбитражный суд', bind: 'case.court', required: true, placeholder: 'Арбитражный суд города Москвы' })}
          ${field({ label: 'Номер дела', bind: 'case.number', required: true, placeholder: 'А40-000000/2025' })}
          ${field({ label: 'Адрес суда', bind: 'case.courtAddress', wide: true })}
          ${field({ label: 'Процедура', bind: 'case.procedure', type: 'select', options: D.PROCEDURES })}
          ${field({ label: 'Дата введения процедуры', bind: 'case.procedureDate', type: 'date' })}
          ${field({ label: 'Дата возбуждения дела', bind: 'case.caseStartDate', type: 'date', hint: 'От неё считаются периоды подозрительности' })}
          ${field({ label: 'Реквизиты судебного акта', bind: 'case.judicialAct', wide: true, placeholder: 'Решением Арбитражного суда города Москвы от 12.03.2025 по делу № А40-000000/2025' })}
          ${field({ label: 'Размер требований кредиторов, ₽', bind: 'case.creditorsSum', money: true })}
        </div>
      </div>

      <div class="card">
        <h3>Должник</h3>
        <p class="m">Реквизиты должника подставляются в шапку, описание сделки и требования.</p>
        ${partyForm(debtor, 'case.', debtorIndex(c))}
      </div>

      <div class="card">
        <h3>Арбитражный управляющий</h3>
        <p class="m">Пустые поля берутся из профиля — заполнять по каждому делу не нужно.</p>
        <div class="form">
          ${field({ label: 'ФИО', bind: 'case.managerName', placeholder: db.profile.name || 'Иванов Иван Иванович' })}
          ${field({ label: 'СРО', bind: 'case.managerSro', placeholder: db.profile.sro || '' })}
          ${field({ label: 'Адрес для корреспонденции', bind: 'case.managerAddress', wide: true, placeholder: db.profile.address || '' })}
          ${field({ label: 'Контакты', bind: 'case.managerContacts', wide: true, placeholder: db.profile.contacts || 'тел. +7 000 000-00-00, e-mail: ...' })}
        </div>
      </div>`;
  }

  const debtorIndex = (c) => c.parties.findIndex((p) => p.id === c.debtorId);

  /** Форма стороны: набор полей зависит от того, кто это — организация, ИП или гражданин. */
  function partyForm(p, prefix, index) {
    if (!p) return '<p class="hint">Сторона не выбрана.</p>';
    const b = prefix === 'case.' ? `case.parties.${index}.` : 'party.';
    const head = `<div class="f wide"><label class="lb">Тип стороны</label>
      ${radios(b + 'kind', D.PARTY_KINDS, p.kind)}</div>`;

    let body;
    if (p.kind === 'org') {
      body = field({ label: 'Полное наименование', bind: b + 'nameFull', wide: true, required: true, placeholder: 'Общество с ограниченной ответственностью «Ромашка»' }) +
        field({ label: 'Сокращённое наименование', bind: b + 'nameShort', placeholder: 'ООО «Ромашка»' }) +
        field({ label: 'ИНН', bind: b + 'inn' }) +
        field({ label: 'ОГРН', bind: b + 'ogrn' }) +
        field({ label: 'Юридический адрес', bind: b + 'addressLegal', wide: true }) +
        field({ label: 'Почтовый адрес', bind: b + 'addressPostal', wide: true }) +
        field({ label: 'Руководитель', bind: b + 'director' }) +
        field({ label: 'Представитель', bind: b + 'representative' }) +
        field({ label: 'Основание полномочий', bind: b + 'powerBasis', placeholder: 'Устав, доверенность от ...' });
    } else if (p.kind === 'ip') {
      body = field({ label: 'ФИО', bind: b + 'fio', wide: true, required: true }) +
        field({ label: 'ИНН', bind: b + 'inn' }) +
        field({ label: 'ОГРНИП', bind: b + 'ogrnip' }) +
        field({ label: 'Адрес', bind: b + 'address', wide: true });
    } else {
      body = field({ label: 'ФИО', bind: b + 'fio', wide: true, required: true }) +
        field({ label: 'Дата рождения', bind: b + 'birthDate', type: 'date' }) +
        field({ label: 'ИНН', bind: b + 'inn' }) +
        field({ label: 'Адрес', bind: b + 'address', wide: true });
    }
    return `<div class="form">${head}${body}</div>`;
  }

  function casePartiesTab(c) {
    const rows = c.parties.map((p) => {
      const isDebtor = p.id === c.debtorId;
      const used = c.deals.filter((d) => d.counterpartyId === p.id).length;
      return `<div class="party">
        <div style="min-width:0">
          <div class="nm">${esc(S.partyName(p) || 'Без наименования')}</div>
          <div class="rq">${esc(D.nameOf(D.PARTY_KINDS, p.kind))}${S.partyRequisites(p) ? ' · ' + esc(S.partyRequisites(p)) : ''}${used ? ' · в сделках: ' + used : ''}</div>
        </div>
        ${isDebtor ? '<span class="tag">Должник</span>' : ''}
        <div class="sp">
          <button class="btn btn-sm" data-act="edit-party" data-id="${p.id}">Изменить</button>
          ${isDebtor ? '' : `<button class="btn btn-sm danger" data-act="del-party" data-id="${p.id}">Удалить</button>`}
        </div>
      </div>`;
    }).join('');

    return `<div class="card">
      <h3>Участники дела</h3>
      <p class="m">Сторону сделки достаточно завести один раз — дальше она выбирается из списка,
        а реквизиты подставляются сами.</p>
      ${rows || '<p class="hint">Кроме должника сторон пока нет.</p>'}
      <div style="margin-top:12px"><button class="btn" data-act="new-party">+ Добавить сторону</button></div>
    </div>`;
  }

  function caseDealsTab(c) {
    if (!c.deals.length) {
      return `<div class="empty"><b>Сделок пока нет</b>
        Добавьте сделку — приложение спросит только то, что нужно для заявления.
        <div style="margin-top:16px"><button class="btn pri" data-act="new-deal">+ Добавить сделку</button></div></div>`;
    }
    const rows = c.deals.map((d) => {
      const ready = d.statement.status === 'ready';
      return `<tr class="click" data-go="#/deal/${c.id}/${d.id}">
        <td data-l="Контрагент"><b>${esc(S.partyShort(S.counterpartyOf(c, d)) || '— не выбран —')}</b></td>
        <td data-l="Тип">${esc(S.dealTypeName(d))}</td>
        <td data-l="Дата">${esc(D.dateShort(d.date) || '—')}</td>
        <td class="r" data-l="Сумма">${esc(money0(d.amount))}</td>
        <td class="sub" data-l="Документов">${(d.documents || []).length}</td>
        <td data-l="Статус"><span class="pill ${ready ? 'ready' : 'draft'}">${ready ? 'Готово' : 'Черновик'}</span></td>
      </tr>`;
    }).join('');

    return `<div class="card">
      <table><thead><tr><th>Контрагент</th><th>Тип</th><th>Дата</th><th class="r">Сумма, ₽</th>
        <th>Документов</th><th>Статус</th></tr></thead><tbody>${rows}</tbody></table>
      <div style="margin-top:14px"><button class="btn" data-act="new-deal">+ Добавить сделку</button></div>
    </div>`;
  }

  /* ================= экран сделки ================= */

  function screenDeal() {
    const c = currentCase(), d = currentDeal();
    if (!c || !d) return notFound();
    const cp = S.counterpartyOf(c, d);
    const debtor = S.debtorOf(c);
    const v = S.validate(db, c, d);
    const ready = d.statement.status === 'ready';
    const docs = (d.documents || []).length;

    const head = `<div class="crumbs"><a href="#/">Мои дела</a><span>›</span>
        <a href="#/case/${c.id}">${esc(c.number || 'дело')}</a><span>›</span><span>сделка</span></div>
      <div class="bento anim">
        <div class="t hero s8">
          <div class="k">${esc(S.dealTypeName(d))}${d.number ? ' № ' + esc(d.number) : ''}</div>
          <div class="big">${esc(money0(d.amount))}<small> ₽</small></div>
          <p class="said">${esc(S.partyShort(debtor) || 'должник')} → <b>${esc(S.partyShort(cp) || 'контрагент не выбран')}</b></p>
          <div class="strip">
            <div><b>${esc(D.dateShort(d.date) || '—')}</b>дата сделки</div>
            <div><b>${esc(D.nameOf(D.OBJECT_TYPES, d.object.kind))}</b>объект</div>
            <div><b>${docs}</b>${D.plural(docs, 'документ', 'документа', 'документов')}</div>
            <div><b>${esc(D.nameOf(D.COUNTER, d.counter.state))}</b>встречное исполнение</div>
          </div>
          <div class="act">
            <button class="btn pri" data-go="#/builder/${c.id}/${d.id}">Открыть конструктор</button>
            <button class="btn" data-act="clone-deal">Создать на основе этой</button>
          </div>
        </div>

        <div class="t s4">
          <div class="k">Заявление</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="pill ${ready ? 'ready' : 'draft'}">${ready ? 'Готово' : 'Черновик'}</span>
            ${v.errors.length
        ? `<span class="chipm w"><span class="dot"></span>не заполнено: ${v.errors.length}</span>`
        : '<span class="chipm"><span class="dot"></span>обязательные поля заполнены</span>'}
          </div>
          <p class="m">${d.statement.versions.length
        ? 'Сохранённых версий: ' + d.statement.versions.length
        : 'Версии пока не сохранялись.'}</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px">
            <button class="btn btn-sm" data-act="preview-sheets">Предпросмотр</button>
            <button class="btn btn-sm" data-act="export-docx">Скачать DOCX</button>
            <button class="btn btn-sm danger" data-act="del-deal">Удалить</button>
          </div>
        </div>
      </div>

      <div class="tabs">
        ${tab('deal', 'main', 'Основные сведения')}
        ${tab('deal', 'parties', 'Стороны')}
        ${tab('deal', 'object', 'Объект')}
        ${tab('deal', 'perf', 'Исполнение')}
        ${tab('deal', 'circ', 'Обстоятельства')}
        ${tab('deal', 'docs', 'Документы', docs)}
      </div>`;

    const body = tabs.deal === 'parties' ? dealPartiesTab(c, d)
      : tabs.deal === 'object' ? dealObjectTab(d)
        : tabs.deal === 'perf' ? dealPerfTab(d)
          : tabs.deal === 'circ' ? dealCircTab(d)
            : tabs.deal === 'docs' ? dealDocsTab(d)
              : dealMainTab(d);

    return head + body;
  }

  function dealMainTab(d) {
    return `<div class="card">
      <h3>Основные сведения</h3>
      <p class="m">Тип сделки определяет формулировки в заявлении. Остальные поля появятся по ходу.</p>
      <div class="form">
        ${field({ label: 'Тип сделки', bind: 'deal.type', type: 'select', options: D.DEAL_TYPES, required: true })}
        ${d.type === 'other' ? field({ label: 'Наименование сделки', bind: 'deal.typeOther', placeholder: 'соглашение о ...' }) : ''}
        ${field({ label: 'Дата сделки', bind: 'deal.date', type: 'date', required: true })}
        ${field({ label: 'Номер договора', bind: 'deal.number' })}
        ${field({ label: 'Дата договора', bind: 'deal.contractDate', type: 'date', hint: 'Если отличается от даты сделки' })}
        ${field({ label: 'Сумма сделки', bind: 'deal.amount', money: true, required: true })}
        ${field({ label: 'Валюта', bind: 'deal.currency', type: 'select', options: D.CURRENCIES })}
        ${field({ label: 'Предмет сделки', bind: 'deal.subject', type: 'textarea', wide: true, rows: 2, placeholder: 'Если не заполнено — соберётся из сведений об объекте' })}
      </div>
    </div>`;
  }

  function dealPartiesTab(c, d) {
    const options = [{ id: '', name: '— выберите сторону —' }]
      .concat(c.parties.filter((p) => p.id !== c.debtorId)
        .map((p) => ({ id: p.id, name: S.partyName(p) || 'без наименования' })));
    const cp = S.counterpartyOf(c, d);
    const debtor = S.debtorOf(c);

    return `<div class="card">
      <h3>Стороны сделки</h3>
      <p class="m">Должник подставляется из дела. Контрагент выбирается из участников — повторно
        вводить реквизиты не нужно.</p>
      <div class="party">
        <div style="min-width:0">
          <div class="nm">${esc(S.partyName(debtor) || 'Должник не заполнен')}</div>
          <div class="rq">${esc(S.partyRequisites(debtor))}</div>
        </div>
        <span class="tag">Должник</span>
        <div class="sp"><button class="btn btn-sm" data-act="edit-party" data-id="${debtor ? debtor.id : ''}">Изменить</button></div>
      </div>
      <div class="form" style="margin-top:14px">
        ${field({ label: 'Контрагент (ответчик)', bind: 'deal.counterpartyId', type: 'select', options: options, required: true, wide: true })}
      </div>
      ${cp ? `<div class="party" style="margin-top:10px">
          <div style="min-width:0">
            <div class="nm">${esc(S.partyName(cp))}</div>
            <div class="rq">${esc(D.nameOf(D.PARTY_KINDS, cp.kind))}${S.partyRequisites(cp) ? ' · ' + esc(S.partyRequisites(cp)) : ''}${S.partyAddress(cp) ? ' · ' + esc(S.partyAddress(cp)) : ''}</div>
          </div>
          <div class="sp"><button class="btn btn-sm" data-act="edit-party" data-id="${cp.id}">Изменить</button></div>
        </div>` : ''}
      <div style="margin-top:12px"><button class="btn" data-act="new-party">+ Новая сторона</button></div>
    </div>`;
  }

  /** Динамическая форма объекта (§3): показываем только то, что относится к выбранному типу. */
  function dealObjectTab(d) {
    const o = d.object;
    let body;
    if (o.kind === 'realty') {
      body = field({ label: 'Вид объекта', bind: 'deal.object.realtyKind', list: 'realty-kinds', placeholder: 'Квартира' }) +
        field({ label: 'Кадастровый номер', bind: 'deal.object.cadastral' }) +
        field({ label: 'Адрес', bind: 'deal.object.address', wide: true }) +
        field({ label: 'Площадь, кв. м', bind: 'deal.object.area' }) +
        field({ label: 'Назначение', bind: 'deal.object.purpose' }) +
        field({ label: 'Иные характеристики', bind: 'deal.object.features', type: 'textarea', wide: true, rows: 2 });
    } else if (o.kind === 'vehicle') {
      body = field({ label: 'Марка', bind: 'deal.object.brand' }) +
        field({ label: 'Модель', bind: 'deal.object.model' }) +
        field({ label: 'VIN', bind: 'deal.object.vin' }) +
        field({ label: 'Государственный номер', bind: 'deal.object.plate' }) +
        field({ label: 'Год выпуска', bind: 'deal.object.year' });
    } else if (o.kind === 'money') {
      body = field({ label: 'Сумма платежа, ₽', bind: 'deal.object.sum', money: true }) +
        field({ label: 'Дата платежа', bind: 'deal.object.payDate', type: 'date' }) +
        field({ label: 'Номер платёжного поручения', bind: 'deal.object.orderNumber' }) +
        field({ label: 'Счёт отправителя', bind: 'deal.object.accountFrom' }) +
        field({ label: 'Счёт получателя', bind: 'deal.object.accountTo' }) +
        field({ label: 'Назначение платежа', bind: 'deal.object.purposeText', type: 'textarea', wide: true, rows: 2 });
    } else {
      body = field({ label: 'Описание объекта', bind: 'deal.object.description', type: 'textarea', wide: true, rows: 4 });
    }

    return `<div class="card">
      <h3>Объект сделки</h3>
      <p class="m">Что именно выбыло из имущества должника.</p>
      <div class="form"><div class="f wide"><label class="lb">Тип объекта</label>
        ${radios('deal.object.kind', D.OBJECT_TYPES, o.kind)}</div></div>
      <div class="form step" style="margin-top:14px">
        ${body}
        ${field({ label: 'Стоимость объекта, ₽', bind: 'deal.object.value', money: true, hint: 'Если не указана — берётся сумма сделки' })}

      ${dataList('realty-kinds', D.REALTY_KINDS)}

        ${field({ label: 'Стоимость встречного исполнения, ₽', bind: 'deal.counter.counterValue', money: true })}
        ${field({ label: 'Размер неисполнения, ₽', value: D.money(S.gapValue(d)) || '—', readonly: true })}

      </div>`;

      counterFields = `<div class="form step" style="margin-top:12px">

        ${field({ label: 'Стоимость встречного исполнения, ₽', bind: 'deal.counter.counterValue', money: true })}

      <h3>Исполнение сделки</h3>
      <div class="form"><div class="f wide"><label class="lb">Как исполнена сделка</label>

      <div class="form" style="margin-top:12px">

  /** Вопросы, от ответов на которые зависит состав заявления (§8, §9). */
  function dealCircTab(d) {
    const f = d.flags;
    const q = (bind, value, title, extra) => `<div class="card">
      <h3>${esc(title)}</h3>
      <div style="margin-top:10px">${yesNo(bind, value)}</div>
      ${value ? `<div class="step" style="margin-top:14px">${extra}</div>` : ''}
    </div>`;

    return q('deal.flags.unequal', f.unequal, 'Есть ли признаки неравноценного встречного исполнения?',
      `<div class="note calm" style="margin:0">Стоимости берутся из вкладки «Исполнение»: должник —
        ${esc(D.money(d.counter.debtorValue) || '—')} ₽, встречное — ${esc(D.money(d.counter.counterValue) || '—')} ₽,
        разница — <b>${esc(D.money(S.gapValue(d)) || '—')} ₽</b>.</div>`) +

      q('deal.flags.harm', f.harm, 'Причинён ли вред имущественным правам кредиторов?',
        `<div class="form">${field({ label: 'В чём выразился вред', bind: 'deal.harmNote', type: 'textarea', wide: true, rows: 3, placeholder: 'Имущество выбыло безвозмездно, требования кредиторов остались непогашенными…' })}</div>`) +

      q('deal.flags.affiliation', f.affiliation, 'Есть ли заинтересованность сторон?',
        `<label class="lb">Основание заинтересованности</label>
         ${checkList('deal.affiliationGrounds', D.AFFILIATION_GROUNDS, d.affiliationGrounds)}
         <div class="form" style="margin-top:10px">${field({ label: 'Пояснения', bind: 'deal.affiliationNote', type: 'textarea', wide: true, rows: 2 })}</div>`) +

      q('deal.flags.preference', f.preference, 'Оказано ли предпочтение отдельному кредитору?',
        `<label class="lb">Основание предпочтения</label>
         ${checkList('deal.preferenceGrounds', D.PREFERENCE_GROUNDS, d.preferenceGrounds)}
         <div class="form" style="margin-top:10px">${field({ label: 'Пояснения', bind: 'deal.preferenceNote', type: 'textarea', wide: true, rows: 2 })}</div>`) +

      q('deal.flags.awareness', f.awareness, 'Знал ли контрагент о признаках неплатёжеспособности?',
        `<div class="form">${field({ label: 'Чем подтверждается', bind: 'deal.awarenessNote', type: 'textarea', wide: true, rows: 3 })}</div>`) +

      `<div class="card">
        <h3>Дополнительные обстоятельства</h3>
        <p class="m">Свободный текст, который войдёт в блок «Обстоятельства заключения сделки».</p>
        <div class="form">${field({ label: '', bind: 'deal.circumstances', type: 'textarea', wide: true, rows: 4 })}</div>
      </div>
      <div class="note calm">Ответы «Да» включают соответствующие блоки заявления, «Нет» — выключают.
        В конструкторе состав блоков можно поправить вручную.</div>`;
  }

  function dealDocsTab(d) {
    const docs = d.documents || [];
    const rows = docs.map((doc) => `<tr>
      <td data-l="№">${doc.attach !== false ? attachNo(d, doc) : '—'}</td>
      <td data-l="Документ"><b>${esc(doc.name || D.nameOf(D.DOC_TYPES, doc.type))}</b>
        ${doc.description ? `<div class="sub">${esc(doc.description)}</div>` : ''}</td>
      <td data-l="Тип">${esc(D.nameOf(D.DOC_TYPES, doc.type))}</td>
      <td data-l="Номер">${esc(doc.number || '—')}</td>
      <td data-l="Дата">${esc(D.dateShort(doc.date) || '—')}</td>
      <td data-l="В приложения"><label class="chk" style="padding:0"><input type="checkbox" data-act="toggle-attach"

      <td><div class="rowact">
        <button class="btn btn-sm" data-act="edit-doc" data-id="${doc.id}">Изменить</button>
        <button class="btn btn-sm danger" data-act="del-doc" data-id="${doc.id}">Удалить</button>
      </div></td>
    </tr>`).join('');

    const list = S.attachments(d);
    return `<div class="card">
      <h3>Документы по сделке</h3>
      <p class="m">Отмеченные документы попадают в раздел «Приложения». Нумерация пересчитывается
        автоматически при любом изменении списка.</p>
      ${docs.length ? `<table><thead><tr><th>№</th><th>Документ</th><th>Тип</th><th>Номер</th><th>Дата</th>
        <th>В приложения</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
        : '<p class="hint">Документов пока нет.</p>'}
      <div style="margin-top:14px"><button class="btn" data-act="new-doc">+ Добавить документ</button></div>
    </div>
    ${list.length ? `<div class="card"><h3>Приложения к заявлению</h3>
      <ol style="margin:10px 0 0;padding-left:22px;font-size:13.5px;color:var(--ink-2);line-height:1.7">
      ${list.map((s) => `<li>${esc(s)}</li>`).join('')}</ol></div>` : ''}
    <div class="note calm">Файлы не загружаются в браузер: приложение хранит только реквизиты документа.
